<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src file:; img-src 'self' data:">
  <title>GiroPlay</title>
  <link rel="stylesheet" href="player.css">
</head>
<body data-fit="contain">
  <div id="stage"></div>
  <div id="standby" hidden>
    <div class="mark">GiroPlay</div>
    <div class="hint">Aguardando vídeos na pasta</div>
  </div>

  <!-- Menu de saída (tecla Esc). Fica dentro desta página: nenhuma janela do Windows passa na frente dele. -->
  <div id="menu" hidden>
    <div class="card">
      <div class="title">GiroPlay</div>
      <div class="line">Aperte <kbd>Esc</kbd> de novo para <b>sair</b></div>
      <div class="buttons">
        <button type="button" data-menu="quit" class="danger">Sair do GiroPlay <kbd>Esc</kbd></button>
        <button type="button" data-menu="settings">Configurações <kbd>C</kbd></button>
        <button type="button" data-menu="stop">Parar exibição <kbd>P</kbd></button>
        <button type="button" data-menu="back" class="primary">Voltar <kbd>Enter</kbd></button>
      </div>
      <div class="hint">O painel continua passando por trás. Este menu some sozinho.</div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
